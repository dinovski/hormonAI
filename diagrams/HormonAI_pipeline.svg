<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#374151"/></marker></defs>
<text x="24" y="30" font-size="20" font-weight="800" fill="#111827">HormonAI · Mona — end-to-end pipeline</text>
<text x="24" y="48" font-size="11" fill="#6B7280">FAQ + article knowledge base · English/French · retrieval-only, quotes sources, abstains when out of scope</text>
<text x="24" y="70" font-size="12" font-weight="700" fill="#2563EB">1 · INGESTION  (offline — build the index)</text>
<rect x="24" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="36" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">Sources</text>
<text x="36" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">corpus/  (EN + FR)</text>
<text x="36" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">FAQ .docx + articles</text>
<text x="36" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">(.docx / .md / .txt / .pdf)</text>
<text x="36" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">listed in manifest.json</text>
<rect x="226" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="238" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">Parse by type</text>
<text x="238" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">FAQ  -&gt; atomic Q/A pairs</text>
<text x="238" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">Article -&gt; split on headings</text>
<text x="238" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">  -&gt; overlapping child chunks</text>
<text x="238" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">(breadcrumb + parent link)</text>
<rect x="428" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="440" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">PDF extract + clean</text>
<text x="440" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">PyMuPDF (default)</text>
<text x="440" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">fallback: pypdf</text>
<text x="440" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">strip headers/footers,</text>
<text x="440" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">de-hyphenate, drop page #s</text>
<text x="606" y="172" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="9" font-style="italic" fill="#2563EB">opt QA: pdf_fidelity.py</text>
<rect x="630" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="642" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">Unified schema</text>
<text x="642" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">one lang-tagged record:</text>
<text x="642" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">id · source_type · lang</text>
<text x="642" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">section · heading_path</text>
<text x="642" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">question · answer · parent</text>
<rect x="832" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="844" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">Embed + weight</text>
<text x="844" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">1 multilingual model</text>
<text x="844" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">mpnet (default) /</text>
<text x="844" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">BGE-M3 · e5  (option)</text>
<text x="844" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">+ BM25 + per-lang IDF</text>
<rect x="1034" y="76" width="188" height="104" rx="9" fill="#E8EFFD" stroke="#2563EB" stroke-width="2"/>
<text x="1046" y="97" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563EB">Build indexes</text>
<text x="1046" y="113" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">shared faq_all_* (default)</text>
<text x="1046" y="127" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">+ per-language faq_&lt;lang&gt;_*</text>
<text x="1046" y="141" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">FAISS q·qa·qp + BM25</text>
<text x="1046" y="155" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">+ optional paraphrases</text>
<line x1="212" y1="128.0" x2="226" y2="128.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="414" y1="128.0" x2="428" y2="128.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="616" y1="128.0" x2="630" y2="128.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="818" y1="128.0" x2="832" y2="128.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1020" y1="128.0" x2="1034" y2="128.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="198" width="1198" height="60" rx="9" fill="#EDEFF2" stroke="#4B5563" stroke-width="2"/>
<text x="36" y="219" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4B5563">Index store  (data/)</text>
<text x="36" y="235" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1F2937">FAISS  q · qa · qp  (dense)     +     BM25  (sparse)     +     per-language IDF stats            |            shared  faq_all_*  (default)     ·     per-language  faq_&lt;lang&gt;_*</text>
<line x1="1128.0" y1="180" x2="1128.0" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="1134.0" y="192" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#374151">build / write</text>
<text x="24" y="292" font-size="12" font-weight="700" fill="#059669">2 · QUERY-TIME  (online — answer a question)</text>
<rect x="24" y="300" width="188" height="132" rx="9" fill="#E6F4EF" stroke="#059669" stroke-width="2"/>
<text x="36" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">Ask Mona</text>
<text x="36" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">Streamlit GUI or CLI</text>
<text x="36" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">user selects language</text>
<text x="36" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">(EN / FR)</text>
<text x="36" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">-&gt; retriever query lang</text>
<rect x="226" y="300" width="188" height="132" rx="9" fill="#E6F4EF" stroke="#059669" stroke-width="2"/>
<text x="238" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">Hybrid retrieve</text>
<text x="238" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">BM25 + FAISS q·qa·qp</text>
<text x="238" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">-&gt; Reciprocal Rank Fusion</text>
<text x="238" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">-&gt; fused_score</text>
<text x="238" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">artifact filter (bad Qs)</text>
<rect x="428" y="300" width="188" height="132" rx="9" fill="#E6F4EF" stroke="#059669" stroke-width="2"/>
<text x="440" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">Re-rank</text>
<text x="440" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">CrossEncoder</text>
<text x="440" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">default ON</text>
<text x="440" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">(disable: --no-rerank)</text>
<text x="440" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">-&gt; rerank_score reorders</text>
<rect x="630" y="300" width="188" height="132" rx="9" fill="#E6F4EF" stroke="#059669" stroke-width="2"/>
<text x="642" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">Anchors + routing</text>
<text x="642" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">IDF-weighted anchors</text>
<text x="642" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">(no stopword lists)</text>
<text x="642" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">same-language first  -&gt;</text>
<text x="642" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">cross-lingual fallback</text>
<rect x="832" y="300" width="188" height="132" rx="9" fill="#FDF1DF" stroke="#D97706" stroke-width="2"/>
<text x="844" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#D97706">Decision  (semantic-first)</text>
<text x="844" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">stats query? grounded-stat gate</text>
<text x="844" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">accept if relevance &gt;= threshold</text>
<text x="844" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">or high-IDF lexical safety net</text>
<text x="844" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1F2937">-&gt; assemble answer bundle</text>
<rect x="1034" y="300" width="188" height="132" rx="9" fill="#E6F4EF" stroke="#059669" stroke-width="2"/>
<text x="1046" y="321" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">Format + answer</text>
<text x="1046" y="337" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">FAQ quoted verbatim</text>
<text x="1046" y="351" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">+ source citations</text>
<text x="1046" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">opt: LLM empathy preface</text>
<text x="1046" y="379" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">opt: cross-lingual notice</text>
<text x="1046" y="393" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">-&gt; reply + audit log</text>
<line x1="212" y1="366.0" x2="226" y2="366.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="414" y1="366.0" x2="428" y2="366.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="616" y1="366.0" x2="630" y2="366.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="818" y1="366.0" x2="832" y2="366.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1020" y1="366.0" x2="1034" y2="366.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320.0" y1="258" x2="320.0" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="326.0" y="294" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#374151">retrieve (read)</text>
<rect x="832" y="450" width="188" height="82" rx="9" fill="#FBE9E9" stroke="#DC2626" stroke-width="2"/>
<text x="844" y="471" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#DC2626">Abstain  (safety)</text>
<text x="844" y="487" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">not in knowledge base -&gt;</text>
<text x="844" y="501" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">“please discuss with</text>
<text x="844" y="515" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">your oncology team”</text>
<line x1="926.0" y1="432" x2="926.0" y2="450" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="932.0" y="444" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#DC2626">no relevant match</text>
<rect x="24" y="560" width="794" height="64" rx="9" fill="#F1EAFB" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>
<text x="36" y="581" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7C3AED">Evaluation  (offline — gate every change)</text>
<text x="36" y="597" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">gold set  tests/eval_set.jsonl  -&gt;  tests/eval_retrieval.py</text>
<text x="36" y="611" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1F2937">recall@k · decision accuracy · false-answer / false-abstention rates</text>
<line x1="523" y1="560" x2="832" y2="366.0" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="590" y="546" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#7C3AED">calibrate thresholds</text>
<rect x="832" y="560" width="390" height="64" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
<text x="842" y="576" font-size="10" font-weight="700" fill="#111827">Legend</text>
<rect x="842" y="580" width="10" height="10" rx="2" fill="#2563EB"/>
<text x="857" y="588" font-size="9.5" fill="#1F2937">Ingestion</text>
<rect x="970" y="580" width="10" height="10" rx="2" fill="#4B5563"/>
<text x="985" y="588" font-size="9.5" fill="#1F2937">Index store</text>
<rect x="1098" y="580" width="10" height="10" rx="2" fill="#059669"/>
<text x="1113" y="588" font-size="9.5" fill="#1F2937">Query-time</text>
<rect x="842" y="596" width="10" height="10" rx="2" fill="#D97706"/>
<text x="857" y="604" font-size="9.5" fill="#1F2937">Decision/gate</text>
<rect x="970" y="596" width="10" height="10" rx="2" fill="#DC2626"/>
<text x="985" y="604" font-size="9.5" fill="#1F2937">Abstain</text>
<rect x="1098" y="596" width="10" height="10" rx="2" fill="#7C3AED"/>
<text x="1113" y="604" font-size="9.5" fill="#1F2937">Evaluation</text>
<text x="842" y="618" font-size="8.5" fill="#6B7280">solid = default path   ·   dashed = optional / calibration</text>
</svg>